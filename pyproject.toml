[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdock-engine"
version = "0.1.0"
description = "Evidence-driven cold recovery for stateless Docker workloads"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
ghostdock = "ghostdock.cli:main"

[tool.setuptools.packages.find]
include = ["ghostdock*"]

[tool.setuptools.package-data]
ghostdock = ["bootstrap.sh"]

[tool.black]
target-version = ["py311"]
line-length = 110

[tool.isort]
profile = "black"
line_length = 110
skip = [".venv", "artifacts"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "artifacts"]
# Intentional trust boundaries are documented in docs/security.md.
# B404: subprocess import; B603: fixed argv + shell=False; B607: required PATH-installed CLIs.
# B310: validated loopback-only HTTP health probes; B104: demo container listener.
skips = ["B404", "B603", "B607", "B310", "B104"]

[tool.coverage.run]
source = ["ghostdock"]
branch = true
omit = ["ghostdock/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
