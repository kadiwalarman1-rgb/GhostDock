AWSTemplateFormatVersion: '2010-09-09'
Description: GhostDock lab network and IAM foundation. Creates no EC2 instance or NAT gateway.
Parameters:
  WorkloadName:
    Type: String
    Default: ghostdock-demo
    AllowedPattern: '[a-z][a-z0-9-]{2,39}'
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  LabVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.88.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: ghostdock-lab
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LabVpc
      InternetGatewayId: !Ref InternetGateway
  LabSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVpc
      CidrBlock: 10.88.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LabVpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref LabSubnet
      RouteTableId: !Ref RouteTable
  WorkloadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GhostDock outbound HTTPS only; no inbound SSH or application ports
      VpcId: !Ref LabVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  ControllerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach to a dedicated GhostDock controller identity after review; never AdministratorAccess.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RegionalReadOnlyChecks
            Effect: Allow
            Action:
              - ec2:DescribeImages
              - ec2:DescribeInstances
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ssm:DescribeInstanceInformation
              - ssm:GetCommandInvocation
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: LaunchOnlyTaggedWorkload
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:RequestTag/ManagedBy: GhostDock
                aws:RequestTag/Workload: !Ref WorkloadName
                ec2:InstanceType: [t3.micro, t3.small, t2.micro]
          - Sid: LaunchDependenciesInThisNetwork
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}::image/${LatestAmi}
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${LabSubnet}
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${WorkloadSecurityGroup}
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
          - Sid: TagOnlyAtLaunch
            Effect: Allow
            Action: ec2:CreateTags
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            Condition:
              StringEquals:
                ec2:CreateAction: RunInstances
          - Sid: TerminateOnlyThisManagedWorkload
            Effect: Allow
            Action: ec2:TerminateInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                ec2:ResourceTag/ManagedBy: GhostDock
                ec2:ResourceTag/Workload: !Ref WorkloadName
          - Sid: UseOnlyTheHealthCommandDocument
            Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
          - Sid: CommandsOnlyOnThisManagedWorkload
            Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                ssm:resourceTag/ManagedBy: GhostDock
                ssm:resourceTag/Workload: !Ref WorkloadName
          - Sid: PassOnlyTheSSMInstanceRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt InstanceRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: ec2.amazonaws.com
Outputs:
  AmiId:
    Value: !Ref LatestAmi
  SubnetId:
    Value: !Ref LabSubnet
  SecurityGroupId:
    Value: !Ref WorkloadSecurityGroup
  InstanceProfile:
    Value: !Ref InstanceProfile
  ControllerPolicyArn:
    Value: !Ref ControllerPolicy
