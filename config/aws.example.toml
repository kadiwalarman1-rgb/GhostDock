# Copy to config/aws.toml. See docs/aws-runbook.md; this file contains placeholders.
[workload]
name = "ghostdock-demo"
image = "ghcr.io/YOUR_GITHUB_USERNAME/ghostdock-demo@sha256:REPLACE_WITH_REAL_DIGEST"
container_port = 8080
host_port = 8080
health_path = "/healthz"
expected_body = '"service": "ghostdock-demo"'

[recovery]
failure_threshold = 3
poll_seconds = 5
startup_seconds = 30
cloud_timeout_seconds = 600
ttl_minutes = 30

[aws]
region = "ap-south-1"
ami_id = "REPLACE_FROM_STACK_OUTPUT"
subnet_id = "REPLACE_FROM_STACK_OUTPUT"
security_group_id = "REPLACE_FROM_STACK_OUTPUT"
instance_profile = "REPLACE_FROM_STACK_OUTPUT"
instance_type = "t3.micro"
public_ip = true # Outbound access in the example public subnet; incurs public IPv4 charges.
profile = "" # Optional existing AWS CLI profile; never put access keys here.
